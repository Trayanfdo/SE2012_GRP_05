<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon Diyora - Customer Feedback</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="header">
    <h1>Salon Diyora</h1>
    <p>Customer Feedback & Reports</p>
    <nav class="nav-bar">
        <a href="index.html">Appointments</a>
        <a href="users.html">Accounts & Staff</a>
        <a href="billing.html">Billing & Services</a>
        <a href="reviews.html" class="active">Reviews & Feedback</a>
    </nav>
</div>

<div class="container">
    <!-- Leave Feedback Form -->
    <div class="module-card">
        <h2>Leave a Review</h2>
        <input type="text" id="customerName" placeholder="Your Name" required>
        <input type="number" id="appointmentId" placeholder="Appointment ID (Optional)">
        <select id="rating" style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; font-family: 'Poppins', sans-serif;">
            <option value="5">⭐⭐⭐⭐⭐ (5 Stars - Excellent)</option>
            <option value="4">⭐⭐⭐⭐ (4 Stars - Very Good)</option>
            <option value="3">⭐⭐⭐ (3 Stars - Average)</option>
            <option value="2">⭐⭐ (2 Stars - Poor)</option>
            <option value="1">⭐ (1 Star - Very Bad)</option>
        </select>
        <textarea id="comments" rows="3" placeholder="Write your comments here..." style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; font-family: 'Poppins', sans-serif; resize: vertical; box-sizing: border-box;"></textarea>
        <button class="btn-book" onclick="submitReview()">Submit Feedback</button>
    </div>

    <!-- Recent Reviews -->
    <div class="module-card">
        <h2>Recent Reviews</h2>
        <p style="text-align: center; font-size: 1.2rem; font-weight: 600; color: var(--primary-color);">
            Salon Average Rating: <span id="avgRating">0.0</span>/5
        </p>
        <ul id="serviceList">
            <div id="reviewsList"></div>
        </ul>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:8080/api/reviews';

    function loadReviews() {
        fetch(API_URL)
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('reviewsList');
                list.innerHTML = '';
                if(data.length === 0) list.innerHTML = '<li>No reviews yet.</li>';

                data.forEach(r => {
                    list.innerHTML += `
                            <li style="flex-direction: column; align-items: flex-start;">
                                <div style="width: 100%; display: flex; justify-content: space-between; margin-bottom: 10px;">
                                    <strong>${r.customerName}</strong>
                                    <span style="color: #f39c12; font-weight: bold;">★ ${r.rating}/5</span>
                                </div>
                                <p style="margin: 0 0 10px 0; color: #555;">"${r.comments || 'No comment provided.'}"</p>
                                <small style="color: #999;">${new Date(r.createdAt).toLocaleString()}</small>
                            </li>
                        `;
                });
            });

        fetch(`${API_URL}/average`)
            .then(res => res.text())
            .then(avg => document.getElementById('avgRating').innerText = avg);
    }

    function submitReview() {
        const review = {
            customerName: document.getElementById('customerName').value,
            appointmentId: document.getElementById('appointmentId').value || null,
            rating: parseInt(document.getElementById('rating').value),
            comments: document.getElementById('comments').value
        };

        fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(review)
        })
            .then(res => res.json())
            .then(() => {
                alert('Thank you for your feedback!');
                document.getElementById('comments').value = '';
                document.getElementById('customerName').value = '';
                loadReviews();
            });
    }
    window.onload = loadReviews;
</script>
</body>
</html>
