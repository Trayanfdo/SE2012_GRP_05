<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Salon Diyora - Services</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .service-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .service-card { background: white; border-radius: 8px; padding: 20px; text-align: center; border: 1px solid #eee; }
        .icon-box { font-size: 2rem; color: var(--primary-color); margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="header">
    <h1>Salon Diyora</h1>
    <p>Service Catalogue</p>
    <nav class="nav-bar">
        <a href="services.html" class="active">Services</a>
        <a href="login.html">Login</a>
    </nav>
</div>

<div class="container" style="flex-direction: column;">
    <div class="module-card">
        <h2>Available Treatments</h2>
        <div id="servicesGrid" class="service-grid"></div>
    </div>
</div>

<script>
    function getIcon(name) {
        const n = name.toLowerCase();
        if (n.includes('color')) return 'fa-paint-brush';
        if (n.includes('massage') || n.includes('spa')) return 'fa-spa';
        if (n.includes('facial') || n.includes('clean')) return 'fa-sparkles';
        return 'fa-scissors';
    }

    fetch('http://localhost:8081/api/services').then(res => res.json()).then(data => {
        const grid = document.getElementById('servicesGrid');
        data.forEach(s => {
            grid.innerHTML += `
                <div class="service-card">
                    <div class="icon-box"><i class="fa-solid ${getIcon(s.serviceName)}"></i></div>
                    <h3>${s.serviceName}</h3>
                    <p>⏱ ${s.durationMinutes} mins</p>
                    <p style="color:var(--secondary-color); font-weight:bold;">Rs. ${s.price}</p>
                    <button onclick="window.location.href='login.html'">Book Now</button>
                </div>`;
        });
    });
</script>
</body>
</html>
