<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salon Diyora - Services & Billing</title>
  <!-- Link to the shared CSS file -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="header">
  <h1>Salon Diyora</h1>
  <p>Service Catalogue & Billing System</p>
  <nav class="nav-bar">
    <a href="index.html">Appointments</a>
    <a href="users.html">Accounts & Staff</a>
    <a href="billing.html" class="active">Billing & Services</a>
    <a href="reviews.html">Reviews & Feedback</a>
  </nav>
</div>

<div class="container">
  <!-- Manage Services -->
  <div class="module-card">
    <h2>Add New Service</h2>
    <input type="text" id="serviceName" placeholder="Service Name (e.g., Haircut)" required>
    <input type="number" id="price" placeholder="Price (LKR)" required>
    <input type="number" id="duration" placeholder="Duration (Minutes)" required>
    <button onclick="addService()">Add to Catalogue</button>

    <hr style="border: 1px solid #eee; margin: 25px 0;">

    <h2>Service Catalogue</h2>
    <ul id="serviceList">
      <div id="catalogList"></div>
    </ul>
  </div>

  <!-- Generate Bill -->
  <div class="module-card">
    <h2>Generate Bill</h2>
    <input type="number" id="customerId" placeholder="Customer ID" required>
    <input type="number" id="totalAmount" placeholder="Total Amount (LKR)" required>
    <button class="btn-book" onclick="generateBill()">Process Payment</button>

    <hr style="border: 1px solid #eee; margin: 25px 0;">

    <h2>Recent Transactions</h2>
    <ul id="serviceList">
      <div id="billList"></div>
    </ul>
  </div>
</div>

<script>
  const API_URL = 'http://localhost:8080/api/billing';

  function loadData() {
    fetch(`${API_URL}/services`)
            .then(res => res.json())
            .then(data => {
              const list = document.getElementById('catalogList');
              list.innerHTML = '';
              data.forEach(s => {
                list.innerHTML += `
                            <li>
                                <span><strong>${s.serviceName}</strong><br><small>⏱ ${s.durationMinutes} mins</small></span>
                                <span class="service-price">Rs. ${s.price}</span>
                            </li>`;
              });
            });

    fetch(`${API_URL}/bills`)
            .then(res => res.json())
            .then(data => {
              const list = document.getElementById('billList');
              list.innerHTML = '';
              data.forEach(b => {
                list.innerHTML += `
                            <li>
                                <span><strong>Customer ID: ${b.customerId}</strong><br><small>${new Date(b.billingDate).toLocaleString()}</small></span>
                                <span class="service-price" style="color: var(--secondary-color);">Rs. ${b.totalAmount}</span>
                            </li>`;
              });
            });
  }

  function addService() {
    const service = {
      serviceName: document.getElementById('serviceName').value,
      price: parseFloat(document.getElementById('price').value),
      durationMinutes: parseInt(document.getElementById('duration').value)
    };
    fetch(`${API_URL}/services`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(service)
    }).then(() => { alert('Service Added!'); loadData(); });
  }

  function generateBill() {
    const bill = {
      customerId: parseInt(document.getElementById('customerId').value),
      totalAmount: parseFloat(document.getElementById('totalAmount').value)
    };
    fetch(`${API_URL}/bills`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(bill)
    }).then(() => { alert('Bill Generated Successfully!'); loadData(); });
  }
  window.onload = loadData;
</script>
</body>
</html>
