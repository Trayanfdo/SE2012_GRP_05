<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon Diyora - Account & Staff</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .btn-action {
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            font-size: 0.8rem;
            margin-left: 5px;
        }
        .btn-edit { background-color: #ffc107; color: #333; }
        .btn-delete { background-color: #dc3545; }

        /* Edit Modal / Form Styling */
        #editModal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 1000;
            width: 320px;
        }
        #modalOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>Salon Diyora</h1>
    <p>Customer Accounts & Staff Directory</p>
    <nav class="nav-bar">
        <a href="index.html">Appointments</a>
        <a href="login.html">Login / Register</a>
        <a href="users.html" class="active">Accounts & Staff</a>
        <a href="billing.html">Billing & Services</a>
        <a href="reviews.html">Reviews & Feedback</a>
    </nav>
</div>

<div class="container">
    <!-- Staff Profiles Section -->
    <div class="module-card" style="width: 100%;">
        <h2>Our Stylists</h2>
        <button onclick="loadStaff()" style="background-color: var(--secondary-color); margin-bottom: 20px;">Refresh Staff List</button>
        <ul id="staffList" style="list-style: none; padding: 0;">
            <li style="color: #888; text-align: center;">Click refresh to load staff</li>
        </ul>
    </div>
</div>

<!-- Edit Stylist Modal Popup -->
<div id="editModal" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 30px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 1000; width: 340px;">
    <h3 style="margin-top: 0; margin-bottom: 20px;">Edit Stylist Details</h3>
    <input type="hidden" id="editId">

    <input type="text" id="editName" placeholder="Full Name" style="width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;" required>

    <input type="text" id="editPhone" placeholder="Phone Number" style="width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;" required>

    <select id="editRole" style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;">
        <option value="STYLIST">Stylist (Staff)</option>
        <option value="RECEPTIONIST">Receptionist</option>
        <option value="CUSTOMER">Customer</option>
    </select>

    <button onclick="saveStylistChanges()" style="background-color: #5936a2; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: 600; cursor: pointer; margin-bottom: 8px;">Save Changes</button>
    <button onclick="closeEditModal()" style="background-color: #6c757d; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: 600; cursor: pointer;">Cancel</button>
</div>

<script>
    const API_URL = 'http://localhost:8081/api/users';

    function loadStaff() {
        fetch(`${API_URL}/staff`)
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('staffList');
                list.innerHTML = '';
                if (!data || data.length === 0) {
                    list.innerHTML = '<li style="color: red; text-align: center;">No stylists found.</li>';
                    return;
                }
                data.forEach(staff => {
                    list.innerHTML += `
                            <li style="display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee;">
                                <span>
                                    <strong>${staff.name}</strong> (ID: ${staff.id})<br>
                                    <small style="color: #666;">Phone: ${staff.phone}</small> |
                                    <span style="color: var(--primary-color); font-weight: 600;">${staff.role}</span>
                                </span>
                                <div>
                                    <button class="btn-action btn-edit" onclick="openEditModal(${staff.id}, '${staff.name}', '${staff.phone}', '${staff.role}')">Edit</button>
                                    <button class="btn-action btn-delete" onclick="deleteStylist(${staff.id})">Delete</button>
                                </div>
                            </li>
                        `;
                });
            })
            .catch(err => console.error('Error fetching staff list:', err));
    }

    // Delete Stylist Function
    function deleteStylist(id) {
        if (confirm(`Are you sure you want to delete stylist ID ${id}?`)) {
            fetch(`${API_URL}/${id}`, {
                method: 'DELETE'
            })
                .then(res => res.text())
                .then(msg => {
                    alert(msg);
                    loadStaff(); // Reload list after deletion
                })
                .catch(err => console.error('Error deleting user:', err));
        }
    }

    // Open Modal Form
    function openEditModal(id, name, phone, role) {
        document.getElementById('editId').value = id;
        document.getElementById('editName').value = name;
        document.getElementById('editPhone').value = phone;
        document.getElementById('editRole').value = role;
        document.getElementById('editModal').style.display = 'block';
        document.getElementById('modalOverlay').style.display = 'block';
    }

    // Close Modal Form
    function closeEditModal() {
        document.getElementById('editModal').style.display = 'none';
        document.getElementById('modalOverlay').style.display = 'none';
    }

    // Save Edited Details
    function saveStylistChanges() {
        const id = document.getElementById('editId').value;
        const updatedData = {
            name: document.getElementById('editName').value,
            phone: document.getElementById('editPhone').value,
            role: document.getElementById('editRole').value
        };

        fetch(`${API_URL}/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(updatedData)
        })
            .then(res => res.json())
            .then(data => {
                alert('✅ Stylist updated successfully!');
                closeEditModal();
                loadStaff(); // Reload list with new details
            })
            .catch(err => console.error('Error updating stylist:', err));
    }

    window.onload = loadStaff;
</script>
</body>
</html>
