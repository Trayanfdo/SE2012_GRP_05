<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon Diyora - Receptionist Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="header">
    <h1>Salon Diyora - Receptionist Portal</h1>
    <p id="welcomeMsg">Welcome Receptionist</p>
    <button onclick="logout()" style="width: auto; padding: 8px 18px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Logout</button>
</div>

<div class="container" style="flex-direction: column;">

    <!-- SECTION 1: COMPLETED APPOINTMENTS PENDING BILL GENERATION -->
    <div class="module-card">
        <h2><i class="fa-solid fa-bell"></i> Completed Appointments Ready for Billing</h2>
        <p style="color:#666; font-size:0.9rem;">Services marked as completed by stylists appear here. Calculate the total and click "Generate Bill" to create the payment record and PDF invoice.</p>
        <button onclick="loadCompletedAppointments()" style="width:auto; margin-bottom:15px;"><i class="fa-solid fa-rotate"></i> Refresh Pending Bills</button>
        <ul id="completedList" style="list-style: none; padding: 0;"></ul>
    </div>

    <!-- SECTION 2: BILLING HISTORY AND PDF INVOICES -->
    <div class="module-card">
        <h2><i class="fa-solid fa-file-invoice-dollar"></i> Billing History & Invoices</h2>
        <ul id="billsList" style="list-style: none; padding: 0;"></ul>
    </div>

</div>

<script>
    const API_APPOINTMENTS = 'http://localhost:8081/api/appointments';
    const API_SERVICES = 'http://localhost:8081/api/services';

    // Session Security Check
    const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
    if (!currentUser || (currentUser.role.toUpperCase() !== 'RECEPTIONIST' && currentUser.role.toUpperCase() !== 'OWNER')) {
        alert('Access Denied: Receptionist login required.');
        window.location.href = 'login.html';
    } else {
        document.getElementById('welcomeMsg').innerText = `Logged in as: ${currentUser.name} (Receptionist)`;
    }

    // FIXED LOGOUT FUNCTION
    function logout() {
        if (confirm("Are you sure you want to log out?")) {
            sessionStorage.removeItem('currentUser');
            sessionStorage.clear();
            window.location.replace('login.html');
        }
    }

    // Load appointments marked COMPLETED by stylists
    function loadCompletedAppointments() {
        fetch(API_APPOINTMENTS)
            .then(res => res.json())
            .then(allApps => {
                const list = document.getElementById('completedList');
                list.innerHTML = '';

                if (!Array.isArray(allApps) || allApps.length === 0) {
                    list.innerHTML = '<li style="color:#888; padding:10px;">No appointments found.</li>';
                    return;
                }

                // Filter for appointments with status COMPLETED
                const completedApps = allApps.filter(a => a.status && a.status.toUpperCase() === 'COMPLETED');

                if (completedApps.length === 0) {
                    list.innerHTML = '<li style="color:#888; padding:10px;">No completed appointments pending bill generation.</li>';
                    return;
                }

                completedApps.forEach(a => {
                    const timeStr = a.appointmentTime ? a.appointmentTime.replace('T', ' ') : 'N/A';
                    list.innerHTML += `
                        <li style="display:flex; justify-content:space-between; align-items:center; padding:12px; border-bottom:1px solid #eee;">
                            <span>
                                <strong><i class="fa-solid fa-user-check"></i> Appointment #${a.id}</strong><br>
                                <small>Customer ID: ${a.customerId} | Stylist ID: ${a.stylistId} | Time: ${timeStr}</small>
                            </span>
                            <div>
                                <button onclick="generateBillForAppointment(${a.id}, ${a.customerId})" style="background-color:var(--secondary-color, #28a745); color:white; border:none; padding:8px 14px; border-radius:4px; cursor:pointer; font-weight:600;">
                                    <i class="fa-solid fa-calculator"></i> Calculate & Generate Bill
                                </button>
                            </div>
                        </li>`;
                });
            })
            .catch(err => {
                console.error('Error loading appointments:', err);
                document.getElementById('completedList').innerHTML = '<li style="color:red; padding:10px;">Failed to load completed appointments from server.</li>';
            });
    }

    // Generate Bill and open PDF
    function generateBillForAppointment(appointmentId, customerId) {
        const amount = prompt("Enter total calculated bill amount (LKR):", "2500");
        if (!amount || isNaN(amount) || parseFloat(amount) <= 0) {
            alert("Please enter a valid billing amount.");
            return;
        }

        const payload = {
            appointmentId: appointmentId,
            customerId: customerId,
            totalAmount: parseFloat(amount)
        };

        fetch(`${API_SERVICES}/bills`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
            .then(res => res.json())
            .then(bill => {
                alert('✅ Bill generated successfully! Opening PDF Invoice...');
                window.open(`${API_SERVICES}/bills/${bill.id}/pdf`, '_blank');
                loadCompletedAppointments();
                loadBills();
            })
            .catch(err => alert('Error generating bill: ' + err.message));
    }

    // Fetch existing bills
    function loadBills() {
        fetch(`${API_SERVICES}/bills`)
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('billsList');
                list.innerHTML = '';

                if (!Array.isArray(data) || data.length === 0) {
                    list.innerHTML = '<li style="color:#888; padding:10px;">No invoices generated yet.</li>';
                    return;
                }

                data.forEach(b => {
                    list.innerHTML += `
                        <li style="display:flex; justify-content:space-between; align-items:center; padding:10px; border-bottom:1px solid #eee;">
                            <span>
                                <strong>Invoice #INV-${b.id}</strong> | Customer ID: ${b.customerId}<br>
                                <small style="color:#666;">Date: ${new Date(b.billingDate).toLocaleString()}</small> |
                                <span style="color:var(--secondary-color, #28a745); font-weight:600;">Rs. ${b.totalAmount.toLocaleString()}</span>
                            </span>
                            <a href="${API_SERVICES}/bills/${b.id}/pdf" target="_blank" style="color:var(--primary-color, #5936a2); font-weight:600; text-decoration:none;">
                                <i class="fa-solid fa-file-pdf"></i> Download PDF
                            </a>
                        </li>`;
                });
            })
            .catch(err => console.error('Error loading bills:', err));
    }

    window.onload = () => {
        loadCompletedAppointments();
        loadBills();
    };
</script>
</body>
</html>
