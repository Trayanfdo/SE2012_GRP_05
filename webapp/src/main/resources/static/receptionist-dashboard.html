<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Salon Diyora - Reception Desk</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="header">
    <h1>Salon Diyora - Reception Counter</h1>
    <p id="welcomeMsg">Welcome, Receptionist</p>
    <button onclick="logout()" style="width: auto; padding: 6px 16px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer;">Logout</button>
</div>

<div class="container">
    <!-- Record Payment & Generate Bill -->
    <div class="module-card">
        <h2>Record Payment & Generate Bill</h2>
        <input type="number" id="billCustId" placeholder="Customer ID" required>
        <input type="number" id="billAmount" placeholder="Total Amount (LKR)" required>
        <button class="btn-book" onclick="processPayment()">Process Payment</button>
        <div id="billMsg" style="margin-top: 10px; text-align: center; font-weight: 600;"></div>
    </div>

    <!-- Recent Transactions -->
    <div class="module-card">
        <h2>Recent Payment Records</h2>
        <ul id="recentBills" style="list-style: none; padding: 0;"></ul>
    </div>
</div>

<script>
    const user = JSON.parse(sessionStorage.getItem('currentUser'));
    if (!user || (user.role.toUpperCase() !== 'RECEPTIONIST' && user.role.toUpperCase() !== 'OWNER')) {
        alert('Access Denied: Receptionist authorization required.');
        window.location.href = 'login.html';
    } else {
        document.getElementById('welcomeMsg').innerText = `Logged in as: ${user.name} (${user.role})`;
    }

    function logout() {
        sessionStorage.clear();
        window.location.href = 'login.html';
    }

    function processPayment() {
        const customerId = document.getElementById('billCustId').value;
        const totalAmount = document.getElementById('billAmount').value;

        fetch('http://localhost:8081/api/billing/bills', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ customerId: parseInt(customerId), totalAmount: parseFloat(totalAmount) })
        })
            .then(res => res.json())
            .then(data => {
                document.getElementById('billMsg').style.color = 'green';
                document.getElementById('billMsg').innerText = '✅ Bill Generated & Payment Recorded!';
                loadTransactions();
            });
    }

    function loadTransactions() {
        fetch('http://localhost:8081/api/billing/bills')
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('recentBills');
                list.innerHTML = '';
                data.forEach(b => {
                    list.innerHTML += `
                            <li style="padding: 10px; border-bottom: 1px solid #eee;">
                                Customer #${b.customerId} — <strong style="color: var(--secondary-color);">Rs. ${b.totalAmount}</strong>
                                <br><small style="color: #666;">Date: ${new Date(b.billingDate).toLocaleString()}</small>
                            </li>`;
                });
            });
    }

    window.onload = loadTransactions;
</script>
</body>
</html>
