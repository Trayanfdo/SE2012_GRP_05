<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon Diyora - Login & Register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="header">
    <h1>Salon Diyora</h1>
    <p>Customer & Staff Portal</p>
</div>

<div class="container">
    <div class="module-card">
        <h2>User Login</h2>
        <input type="text" id="loginPhone" placeholder="Enter Phone Number" required>

        <div class="password-container">
            <input type="password" id="loginPassword" placeholder="Enter Password" required>
            <i class="fa-solid fa-eye toggle-password" onclick="togglePasswordVisibility('loginPassword', this)"></i>
        </div>

        <button onclick="performLogin()">Login</button>
        <div id="loginMessage" style="margin-top: 15px; text-align: center; font-weight: 600;"></div>
    </div>

    <div class="module-card">
        <h2>Create Account</h2>
        <input type="text" id="regName" placeholder="Full Name" required>
        <input type="text" id="regPhone" placeholder="Phone Number" required>

        <div class="password-container">
            <input type="password" id="regPassword" placeholder="Password" required>
            <i class="fa-solid fa-eye toggle-password" onclick="togglePasswordVisibility('regPassword', this)"></i>
        </div>

        <!-- OWNER OPTION REMOVED -->
        <select id="regRole">
            <option value="CUSTOMER">Customer</option>
            <option value="STYLIST">Stylist (Staff)</option>
            <option value="RECEPTIONIST">Receptionist</option>
        </select>

        <button class="btn-book" onclick="performRegistration()">Register Account</button>
        <div id="regMessage" style="margin-top: 15px; text-align: center; font-weight: 600;"></div>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:8081/api/users';

    function togglePasswordVisibility(inputId, iconElement) {
        const passwordInput = document.getElementById(inputId);
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            iconElement.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            iconElement.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }

    function performLogin() {
        const phone = document.getElementById('loginPhone').value;
        const password = document.getElementById('loginPassword').value;
        const msgBox = document.getElementById('loginMessage');

        if (!phone || !password) {
            msgBox.style.color = 'red';
            msgBox.innerText = 'Please enter phone number and password.';
            return;
        }

        fetch(`${API_URL}/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone, password })
        })
            .then(async res => {
                if (!res.ok) throw new Error(await res.text());
                return res.json();
            })
            .then(user => {
                msgBox.style.color = 'var(--secondary-color, #28a745)';
                msgBox.innerText = `Welcome ${user.name}! Redirecting...`;
                sessionStorage.setItem('currentUser', JSON.stringify(user));

                setTimeout(() => {
                    const role = user.role ? user.role.toUpperCase() : '';
                    if (role.includes('OWNER')) window.location.href = 'owner-dashboard.html';
                    else if (role.includes('RECEPTIONIST')) window.location.href = 'receptionist-dashboard.html';
                    else if (role.includes('STYLIST') || role.includes('STAFF')) window.location.href = 'stylist-dashboard.html';
                    else window.location.href = 'customer-dashboard.html';
                }, 1000);
            })
            .catch(err => {
                msgBox.style.color = 'red';
                msgBox.innerText = err.message || 'Login failed.';
            });
    }

    function performRegistration() {
        const user = {
            name: document.getElementById('regName').value,
            phone: document.getElementById('regPhone').value,
            password: document.getElementById('regPassword').value,
            role: document.getElementById('regRole').value
        };

        fetch(`${API_URL}/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(user)
        })
            .then(res => res.json())
            .then(data => {
                document.getElementById('regMessage').style.color = 'var(--secondary-color, #28a745)';
                document.getElementById('regMessage').innerText = `Registered successfully! Please login.`;
            });
    }
</script>
</body>
</html>
