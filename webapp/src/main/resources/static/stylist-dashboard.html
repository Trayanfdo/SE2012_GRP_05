<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Salon Diyora - Stylist Portal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="header">
    <h1>Salon Diyora - Stylist Schedule</h1>
    <p id="welcomeMsg">Welcome Stylist</p>
    <button onclick="logout()" style="width: auto; padding: 6px 16px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer;">Logout</button>
</div>

<div class="container" style="flex-direction: column;">
    <div class="module-card">
        <h2>My Upcoming Work Schedule</h2>
        <ul id="scheduleList" style="list-style: none; padding: 0;"></ul>
    </div>
</div>

<script>
    const API_APPOINTMENTS = 'http://localhost:8081/api/appointments';

    const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
    if (!currentUser || currentUser.role.toUpperCase() !== 'STYLIST') window.location.href = 'login.html';
    else document.getElementById('welcomeMsg').innerText = `Logged in as: ${currentUser.name} (Stylist)`;

    function logout() { sessionStorage.clear(); window.location.href = 'login.html'; }

    function loadSchedule() {
        fetch(`${API_APPOINTMENTS}/stylist/${currentUser.id}`).then(res => res.json()).then(data => {
            const list = document.getElementById('scheduleList');
            list.innerHTML = '';
            if (!data.length) list.innerHTML = '<li>No upcoming bookings assigned.</li>';

            data.forEach(a => {
                list.innerHTML += `
                    <li style="display:flex; justify-content:space-between; align-items:center; padding:15px; border-bottom:1px solid #eee;">
                        <span>
                            <strong>Appointment #${a.id}</strong><br>
                            Time: ${a.appointmentTime.replace('T', ' ')} | Status: ${a.status}
                        </span>
                        <div>
                            <button onclick="updateStatus(${a.id}, 'COMPLETED')" style="background-color:var(--secondary-color); margin-right:5px; width:auto; padding:8px 12px;">Mark Completed</button>
                            <button onclick="updateStatus(${a.id}, 'CANCELLED')" style="background-color:#dc3545; width:auto; padding:8px 12px;">Cancel Appointment</button>
                        </div>
                    </li>`;
            });
        });
    }

    function updateStatus(id, status) {
        fetch(`${API_APPOINTMENTS}/${id}/status?status=${status}`, { method: 'PUT' })
            .then(() => {
                alert(`Appointment #${id} marked as ${status}. Slot is now freed.`);
                loadSchedule();
            });
    }

    window.onload = loadSchedule;
</script>
</body>
</html>
