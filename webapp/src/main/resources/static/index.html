<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon Diyora - Booking</title>
    <!-- Link to the new external CSS file -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="header">
    <h1>Salon Diyora</h1>
    <p>Premium Hair, Skin, Nail Care & Spa Treatments</p>
    <nav class="nav-bar">
        <a href="index.html" class="active">Appointments</a>
        <a href="users.html">Accounts & Staff</a>
        <a href="billing.html">Billing & Services</a>
        <a href="reviews.html">Reviews & Feedback</a>
    </nav>
</div>

<div class="container">
    <!-- UI for IT25100951: Service & Billing Scope -->
    <div class="module-card">
        <h2>Available Services</h2>
        <ul id="serviceList">
            <!-- Services will load here from the database -->
            <li style="color: #888; text-align: center; justify-content: center;">Click below to load the service catalogue</li>
        </ul>
        <button onclick="loadServices()">Load Services</button>
    </div>

    <!-- UI for IT25101264: Appointment & Scheduling Scope -->
    <div class="module-card">
        <h2>Book an Appointment</h2>
        <input type="number" id="customerId" placeholder="Enter Customer ID (e.g., 1)" required>
        <input type="number" id="stylistId" placeholder="Enter Stylist ID (e.g., 2)" required>
        <input type="datetime-local" id="appointmentTime" required>
        <button class="btn-book" onclick="bookAppointment()">Confirm Booking</button>
    </div>
</div>

<script>
    // 1. Fetching data from your Spring Boot Backend
    function loadServices() {
        fetch('http://localhost:8080/api/services')
            .then(response => response.json())
            .then(data => {
                const list = document.getElementById('serviceList');
                list.innerHTML = '';

                if(data.length === 0) {
                    list.innerHTML = '<li style="color: red;">No services found in the database.</li>';
                    return;
                }

                data.forEach(service => {
                    list.innerHTML += `
                            <li>
                                <span>
                                    <strong>${service.serviceName}</strong><br>
                                    <small style="color: #666;">⏱ ${service.durationMinutes} mins</small>
                                </span>
                                <span class="service-price">Rs. ${service.price}</span>
                            </li>`;
                });
            })
            .catch(error => console.error('Error fetching services:', error));
    }

    // 2. Sending data to your Spring Boot Backend
    function bookAppointment() {
        const customerId = document.getElementById('customerId').value;
        const stylistId = document.getElementById('stylistId').value;
        const appointmentTime = document.getElementById('appointmentTime').value;

        if(!customerId || !stylistId || !appointmentTime) {
            alert("Please fill in all booking fields.");
            return;
        }

        const appointmentData = {
            customerId: customerId,
            stylistId: stylistId,
            appointmentTime: appointmentTime
        };

        fetch('http://localhost:8080/api/appointments', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(appointmentData)
        })
            .then(response => response.json())
            .then(data => {
                alert('✅ Appointment Booked Successfully! Status: ' + data.status);
                // Clear the form fields after successful booking
                document.getElementById('customerId').value = '';
                document.getElementById('stylistId').value = '';
                document.getElementById('appointmentTime').value = '';
            })
            .catch(error => console.error('Error booking:', error));
    }
    // Function to show a styled custom alert box instead of default browser alert
    function showSalonAlert(message, title = "Salon Diyora") {
        // Check if custom alert elements already exist, create if not
        let overlay = document.getElementById('customAlertOverlay');
        let alertBox = document.getElementById('customAlertBox');

        if (!overlay) {
            overlay = document.createElement('div');
            overlay.id = 'customAlertOverlay';
            document.body.appendChild(overlay);

            alertBox = document.createElement('div');
            alertBox.id = 'customAlertBox';
            alertBox.innerHTML = `
            <h3 id="customAlertTitle"></h3>
            <p id="customAlertMessage"></p>
            <button id="customAlertBtn" onclick="closeSalonAlert()">OK</button>
        `;
            document.body.appendChild(alertBox);
        }

        document.getElementById('customAlertTitle').innerText = title;
        document.getElementById('customAlertMessage').innerText = message;

        overlay.style.display = 'block';
        alertBox.style.display = 'block';
    }
    function loadUpcomingCustomerAppointments() {
        fetch(`http://localhost:8081/api/appointments/customer/${currentUser.id}/upcoming`)
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('upcomingAppointmentsList');
                list.innerHTML = '';

                if (!data || data.length === 0) {
                    list.innerHTML = '<p style="color: #888;">You have no upcoming appointments scheduled.</p>';
                    return;
                }

                data.forEach(app => {
                    list.innerHTML += `
                    <div style="padding: 12px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 10px; background: #fdfdfd;">
                        <strong>📅 Appointment #${app.id}</strong><br>
                        <span>Time: ${app.appointmentTime.replace('T', ' ')}</span><br>
                        <small>Stylist ID: ${app.stylistId} | Service ID: ${app.serviceId}</small><br>
                        <span style="color: #0d6efd; font-weight: bold; font-size: 0.85rem;">Status: ${app.status}</span>
                    </div>`;
                });
            })
            .catch(err => console.error('Error fetching upcoming appointments:', err));
    }

    // Call function on page load and after confirming a new booking
    window.onload = () => {
        loadServices();
        loadStylists();
        loadUpcomingCustomerAppointments();
    };

    function closeSalonAlert() {
        const overlay = document.getElementById('customAlertOverlay');
        const alertBox = document.getElementById('customAlertBox');
        if (overlay) overlay.style.display = 'none';
        if (alertBox) alertBox.style.display = 'none';
    }
    // JavaScript function to dynamically assign FontAwesome icons based on service title
    function getServiceIcon(serviceName) {
        if (!serviceName) return 'fa-solid fa-cut'; // Default fallback icon

        const name = serviceName.toLowerCase();

        // Check keywords in the service name
        if (name.includes('color') || name.includes('highlight') || name.includes('tint')) {
            return 'fa-solid fa-paint-brush'; // Painting / Coloring icon
        }
        if (name.includes('beard') && name.includes('styling')) {
            return 'fa-solid fa-user-tie'; // Styling icon
        }
        if (name.includes('beard') || name.includes('trim')) {
            return 'fa-solid fa-scissors'; // Scissors icon
        }
        if (name.includes('haircut') || name.includes('hair') || name.includes('cut')) {
            return 'fa-solid fa-scissors'; // Haircut icon
        }
        if (name.includes('massage') || name.includes('spa')) {
            return 'fa-solid fa-spa'; // Spa & Massage icon
        }
        if (name.includes('facial') || name.includes('cleanup') || name.includes('skin') || name.includes('face')) {
            return 'fa-solid fa-sparkles'; // Skin & Facial icon
        }
        if (name.includes('shave')) {
            return 'fa-solid fa-hand-holding-droplet'; // Shaving icon
        }
        if (name.includes('nail') || name.includes('manicure') || name.includes('pedicure')) {
            return 'fa-solid fa-hand-sparkles'; // Nails icon
        }

        // Default icon if no keywords match
        return 'fa-solid fa-cut';
    }
    function loadServicesWithIcons() {
        fetch('http://localhost:8081/api/services')
            .then(res => res.json())
            .then(services => {
                const container = document.getElementById('serviceGridContainer');
                container.innerHTML = '';

                services.forEach(item => {
                    // Get the FontAwesome class string dynamically
                    const iconClass = getServiceIcon(item.serviceName);

                    // Inject into HTML card structure
                    container.innerHTML += `
                    <div class="service-card">
                        <div class="icon-box">
                            <i class="${iconClass}"></i>
                        </div>
                        <div class="service-title">${item.serviceName}</div>
                        <div class="service-details">
                            <span><i class="fa-regular fa-clock"></i> ${item.durationMinutes} mins</span>
                            <span class="service-price">Rs. ${item.price.toLocaleString()}</span>
                        </div>
                    </div>
                `;
                });
            })
            .catch(err => console.error('Error fetching services:', err));
    }
</script>
</body>
</html>
