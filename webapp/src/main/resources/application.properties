package Salon_Diyora.webapp.config;

import org.springframework.context.annotation.Bean;
import org.springframework.context.annotation.Configuration;
import org.springframework.security.core.userdetails.User;
import org.springframework.security.core.userdetails.UserDetails;
import org.springframework.security.core.userdetails.UserDetailsService;
import org.springframework.security.provisioning.InMemoryUserDetailsManager;

@Configuration
public class SecurityConfig {

@Bean
public UserDetailsService userDetailsService() {
UserDetails owner = User.withUsername("owner")
.password("{noop}owner123")
.roles("OWNER")
.build();

UserDetails receptionist = User.withUsername("receptionist")
.password("{noop}recep123")
.roles("RECEPTIONIST")
.build();

UserDetails customer = User.withUsername("amaya")
.password("{noop}12345")
.roles("CUSTOMER")
.build();

return new InMemoryUserDetailsManager(owner, receptionist, customer);
}
}