# ==========================================
# Database Connection Configuration
# ==========================================
# Using 127.0.0.1 explicitly to prevent localhost IPv6 loopback connection restrictions
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/SalonDiyoraDB?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=00001111

# Driver Class Name
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA & Hibernate Configuration
# ==========================================
# Explicitly set MariaDB dialect to prevent startup metadata auto-detection failures
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# Automatically update/create tables in MySQL based on Java @Entity models on app startup
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the IntelliJ console for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Open-In-View warning log
spring.jpa.open-in-view=true

# ==========================================
# Server Configuration
# ==========================================
# Configures the application port (8081 avoids conflicts if 8080 is used by another service)
server.port=8081